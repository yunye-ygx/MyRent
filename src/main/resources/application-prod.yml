server:
  port: ${SERVER_PORT:8084}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:rent}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  ai:
    openai:
      api-key: ${BAILIAN_API_KEY:}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        enabled: ${MYRENT_AI_RECOMMEND_ENABLED:false}
        options:
          model: ${BAILIAN_CHAT_MODEL:qwen-flash}

knife4j:
  enable: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

myrent:
  jwt:
    secret: ${MYRENT_JWT_SECRET:MyRentJwtSecretChangeMe}
    expire-seconds: ${MYRENT_JWT_EXPIRE_SECONDS:86400}
  ai:
    recommend:
      enabled: ${MYRENT_AI_RECOMMEND_ENABLED:false}
      state-ttl-hours: ${MYRENT_AI_RECOMMEND_STATE_TTL_HOURS:48}
      history-limit: ${MYRENT_AI_RECOMMEND_HISTORY_LIMIT:30}
      prompt-history-limit: ${MYRENT_AI_RECOMMEND_PROMPT_HISTORY_LIMIT:6}
      default-budget-scope: ${MYRENT_AI_RECOMMEND_DEFAULT_BUDGET_SCOPE:STRICT}
  scheduling:
    enabled: ${MYRENT_SCHEDULING_ENABLED:true}
