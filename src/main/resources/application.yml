server:
  port: 8084
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rent?useSSL=false&serverTimezone=UTC
    username: root
    password: 1234
  rabbitmq:
    host: 192.168.100.128
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  data:
    redis:
      host: 192.168.100.128
      password: 123456
      database: 0

  elasticsearch:
    uris: http://192.168.100.128:9200
    connection-timeout: 5s
    socket-timeout: 30s
  ai:
    openai:
      # Spring AI uses the OpenAI-compatible client here, but the target provider is Alibaba Bailian.
      api-key: ${BAILIAN_API_KEY:sk-4bc19b4f8af04134b52a70f8d26027da}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        enabled: ${MYRENT_AI_RECOMMEND_ENABLED:true}
        options:
          model: ${BAILIAN_CHAT_MODEL:qwen-flash}


knife4j:
  enable: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true



myrent:
  jwt:
    secret: MyRentJwtSecretChangeMe
    expire-seconds: 86400
  ai:
    recommend:
      enabled: ${MYRENT_AI_RECOMMEND_ENABLED:true}
      state-ttl-hours: 48
      history-limit: 10
      default-budget-scope: STRICT
